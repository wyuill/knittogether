
name: test-coverage.yaml

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: write  # must be write to push badges

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov, filename = "cobertura.xml")
        shell: Rscript {0}

      # One-time branch creation without placeholder file (safer)
      - name: Ensure badges branch exists
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
        run: |
          set -euo pipefail
          BASE_BRANCH="${GITHUB_REF_NAME}"
          git fetch origin --prune
          if ! git ls-remote --exit-code --heads origin badges; then
            echo "Creating empty badges branch on origin..."
            git checkout --orphan badges
            git rm -rf . || true
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --allow-empty -m "Initialize badges branch (empty)"
            git push origin badges
            git checkout "$BASE_BRANCH"
          else
            echo "badges branch already exists."
          fi
        shell: bash

      - name: Make Coverage Badge
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
        uses: action-badges/cobertura-coverage-xml-badges@0.4.0
        with:
          file-name: coverage.svg
          badge-branch: badges
          github-token: ${{ secrets.GITHUB_TOKEN }}
          coverage-file-name: ${{ github.workspace }}/cobertura.xml
